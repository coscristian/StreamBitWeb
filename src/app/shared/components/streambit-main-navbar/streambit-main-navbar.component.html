<header class="app-header">
  <a class="app-header__logo" routerLink="/home" aria-label="Streambit home">
    <img src="logo.png" alt="Streambit" />
  </a>

  <form class="app-header__search" role="search" (submit)="$event.preventDefault()">
    <label class="sr-only" for="global-search">Search Streambit</label>
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path d="M8.5 3a5.5 5.5 0 0 1 4.38 8.82l3.65 3.65-1.06 1.06-3.65-3.65A5.5 5.5 0 1 1 8.5 3Zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/>
    </svg>
    <input
      id="global-search"
      class="sb-input"
      type="search"
      name="q"
      placeholder="Search films, discussions, or scores"
    />
  </form>

  <div class="app-header__actions">
    <button
      type="button"
      class="icon-btn"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      @if (isDark) {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4.5V2m0 20v-2.5M19.5 12H22M2 12h2.5m14.2-6.7 1.8-1.8M5.5 18.5l1.8-1.8m0-9.4L5.5 5.5m12.4 12.4 1.8 1.8M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16.5 14.5A7 7 0 0 1 9.5 7 6.5 6.5 0 1 0 16.5 14.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      }
    </button>
    <streambit-button label="Log in" severity="secondary" size="small" (onClick)="onLoginClick()"></streambit-button>
    <streambit-button label="Sign up" severity="primary" size="small" (onClick)="onSignUpClick()"></streambit-button>
  </div>
</header>
