<a class="movie-card" [routerLink]="['/content', title.id]">
  <div class="movie-card__poster">
    <img [src]="title.posterUrl" [alt]="title.title" />
    @if (title.availability) {
      <span class="sb-badge movie-card__status">{{ title.availability }}</span>
    }
  </div>
  <div class="movie-card__meta">
    <h3>{{ title.title }}</h3>
    <div class="movie-card__row">
      <span>{{ title.year }}</span>
      <streambit-rating [value]="title.rating" [compact]="true"></streambit-rating>
    </div>
    <p>{{ title.genres.slice(0, 2).join(' · ') }}</p>
  </div>
</a>
