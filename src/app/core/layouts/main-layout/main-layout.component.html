<div class="app-shell" [attr.data-theme]="(activeTheme$ | async)?.name">
  <aside class="sidebar" aria-label="Primary">
    <a class="sidebar__brand" routerLink="/home">
      <img src="logo.png" alt="Streambit" />
    </a>

    <nav class="sidebar__nav">
      <a routerLink="/home" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        Home
      </a>
      <a routerLink="/content" routerLinkActive="is-active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A1.5 1.5 0 0 1 5.5 5h13A1.5 1.5 0 0 1 20 6.5v11A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-11ZM10 9.5v5l4.5-2.5L10 9.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        Movies
      </a>
      <a routerLink="/reviews" routerLinkActive="is-active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 2.1 5.2 5.6.5-4.3 3.7 1.3 5.5L12 16.2 7.3 18.9l1.3-5.5-4.3-3.7 5.6-.5L12 4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        Reviews
      </a>
      <a routerLink="/discussions" routerLinkActive="is-active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5A1.5 1.5 0 0 1 6.5 5h11A1.5 1.5 0 0 1 19 6.5V13a1.5 1.5 0 0 1-1.5 1.5H11l-4 3.5V14.5H6.5A1.5 1.5 0 0 1 5 13V6.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        Discussions
      </a>
      <a routerLink="/scores" routerLinkActive="is-active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9m7 10V5m7 14v-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Scores
      </a>
    </nav>

    <div class="sidebar__footer">
      <p>Follow films, leave reviews, and keep up with live scores in one place.</p>
      <streambit-button label="Join Streambit" severity="primary" size="small" (onClick)="goToRegister()"></streambit-button>
    </div>
  </aside>

  <div class="shell-main">
    <streambit-main-navbar></streambit-main-navbar>
    <div class="shell-content">
      <router-outlet></router-outlet>
      <footer class="shell-footer">
        <span>Streambit</span>
        <a routerLink="/content">Movies</a>
        <a routerLink="/reviews">Reviews</a>
        <a routerLink="/discussions">Discussions</a>
        <a routerLink="/scores">Scores</a>
      </footer>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="Mobile">
    <a routerLink="/home" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      <span>Home</span>
    </a>
    <a routerLink="/content" routerLinkActive="is-active">
      <span>Movies</span>
    </a>
    <a routerLink="/reviews" routerLinkActive="is-active">
      <span>Reviews</span>
    </a>
    <a routerLink="/scores" routerLinkActive="is-active">
      <span>Scores</span>
    </a>
    <a routerLink="/discussions" routerLinkActive="is-active">
      <span>Talk</span>
    </a>
  </nav>
</div>
